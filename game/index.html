<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skybound Archipelago</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #79b8e8; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Skybound Archipelago: fly a prop plane through rings over a chain of islands, then land on the home runway. Bank with A and D or the arrow keys, pitch with the up and down arrows, throttle with W and S."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
